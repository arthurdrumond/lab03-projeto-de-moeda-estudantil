<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Moeda Estudantil — Gestão</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #2c3e50; font-size: 2rem; }
        header p { color: #7f8c8d; }
        
        .container { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; flex-wrap: wrap; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex: 1; min-width: 360px; }
        .card h2 { margin-bottom: 15px; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; font-size: 1.3rem; }
        
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 4px; }
        input, select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        
        fieldset { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 5px; }
        legend { font-size: 0.85rem; font-weight: bold; color: #7f8c8d; padding: 0 5px; }
        
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; padding: 10px; }
        button:hover { background-color: #219150; }
        
        .lista-section h3 { margin-bottom: 10px; color: #2c3e50; font-size: 1.1rem; }
        .item-card { background: #f8f9fa; border: 1px solid #e9ecef; border-left: 4px solid #3498db; padding: 12px; border-radius: 4px; margin-bottom: 10px; }
        .item-card.empresa { border-left-color: #e67e22; }
        .item-title { font-weight: bold; color: #2c3e50; font-size: 1rem; }
        .item-detail { font-size: 0.85rem; color: #666; margin-top: 4px; }
        .badge-saldo { display: inline-block; background: #27ae60; color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.8rem; font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>Sistema de Moeda Estudantil</h1>
        <p>Painel de Cadastro e Listagem — Sprint 2</p>
    </header>

    <div class="container">
        <!-- MÓDULO ALUNO -->
        <section class="card">
            <h2>Cadastrar Aluno</h2>
            <form id="formAluno">
                <div class="form-row">
                    <div class="form-group">
                        <label for="alunoNome">Nome Completo</label>
                        <input type="text" id="alunoNome" required>
                    </div>
                    <div class="form-group">
                        <label for="alunoEmail">E-mail</label>
                        <input type="email" id="alunoEmail" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="alunoLogin">Login</label>
                        <input type="text" id="alunoLogin" required>
                    </div>
                    <div class="form-group">
                        <label for="alunoSenha">Senha</label>
                        <input type="password" id="alunoSenha" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="alunoCpf">CPF</label>
                        <input type="text" id="alunoCpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label for="alunoRg">RG</label>
                        <input type="text" id="alunoRg" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="alunoCurso">Curso</label>
                        <input type="text" id="alunoCurso" required>
                    </div>
                    <div class="form-group">
                        <label for="alunoInstituicao">Instituição de Ensino</label>
                        <select id="alunoInstituicao" required>
                            <option value="">Carregando instituições...</option>
                        </select>
                    </div>
                </div>

                <fieldset>
                    <legend>Endereço</legend>
                    <div class="form-row">
                        <div class="form-group" style="flex:2">
                            <label for="alunoLogradouro">Logradouro</label>
                            <input type="text" id="alunoLogradouro" required>
                        </div>
                        <div class="form-group" style="flex:1">
                            <label for="alunoNumero">Número</label>
                            <input type="text" id="alunoNumero" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="alunoComplemento">Complemento</label>
                            <input type="text" id="alunoComplemento">
                        </div>
                        <div class="form-group">
                            <label for="alunoBairro">Bairro</label>
                            <input type="text" id="alunoBairro" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="alunoCidade">Cidade</label>
                            <input type="text" id="alunoCidade" required>
                        </div>
                        <div class="form-group" style="flex:0.5">
                            <label for="alunoEstado">UF</label>
                            <input type="text" id="alunoEstado" maxlength="2" placeholder="MG" required>
                        </div>
                        <div class="form-group">
                            <label for="alunoCep">CEP</label>
                            <input type="text" id="alunoCep" placeholder="30000-000" required>
                        </div>
                    </div>
                </fieldset>

                <button type="submit">Cadastrar Aluno</button>
            </form>

            <div class="lista-section">
                <h3>Alunos Cadastrados</h3>
                <div id="listaAlunos"><p style="color:#888;">Nenhum aluno cadastrado.</p></div>
            </div>
        </section>

        <!-- MÓDULO EMPRESA PARCEIRA -->
        <section class="card">
            <h2>Cadastrar Empresa Parceira</h2>
            <form id="formEmpresa">
                <div class="form-row">
                    <div class="form-group">
                        <label for="empresaNome">Razão Social / Nome</label>
                        <input type="text" id="empresaNome" required>
                    </div>
                    <div class="form-group">
                        <label for="empresaEmail">E-mail</label>
                        <input type="email" id="empresaEmail" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="empresaLogin">Login</label>
                        <input type="text" id="empresaLogin" required>
                    </div>
                    <div class="form-group">
                        <label for="empresaSenha">Senha</label>
                        <input type="password" id="empresaSenha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="empresaCnpj">CNPJ</label>
                    <input type="text" id="empresaCnpj" placeholder="00.000.000/0001-00" required>
                </div>

                <fieldset>
                    <legend>Endereço</legend>
                    <div class="form-row">
                        <div class="form-group" style="flex:2">
                            <label for="empresaLogradouro">Logradouro</label>
                            <input type="text" id="empresaLogradouro" required>
                        </div>
                        <div class="form-group" style="flex:1">
                            <label for="empresaNumero">Número</label>
                            <input type="text" id="empresaNumero" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresaComplemento">Complemento</label>
                            <input type="text" id="empresaComplemento">
                        </div>
                        <div class="form-group">
                            <label for="empresaBairro">Bairro</label>
                            <input type="text" id="empresaBairro" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresaCidade">Cidade</label>
                            <input type="text" id="empresaCidade" required>
                        </div>
                        <div class="form-group" style="flex:0.5">
                            <label for="empresaEstado">UF</label>
                            <input type="text" id="empresaEstado" maxlength="2" placeholder="MG" required>
                        </div>
                        <div class="form-group">
                            <label for="empresaCep">CEP</label>
                            <input type="text" id="empresaCep" placeholder="30000-000" required>
                        </div>
                    </div>
                </fieldset>

                <button type="submit">Cadastrar Empresa</button>
            </form>

            <div class="lista-section">
                <h3>Empresas Parceiras Cadastradas</h3>
                <div id="listaEmpresas"><p style="color:#888;">Nenhuma empresa cadastrada.</p></div>
            </div>
        </section>
    </div>

    <script>
        const API_ALUNOS = '/alunos';
        const API_EMPRESAS = '/empresas-parceiras';
        const API_INSTITUICOES = '/instituicoes';

        // Carregar opções de Instituições de Ensino no Select
        async function carregarInstituicoes() {
            try {
                const res = await fetch(API_INSTITUICOES);
                if (!res.ok) throw new Error();
                const instituicoes = await res.json();
                const select = document.getElementById('alunoInstituicao');
                
                if (instituicoes.length === 0) {
                    select.innerHTML = '<option value="">Nenhuma instituição encontrada</option>';
                    return;
                }

                select.innerHTML = '<option value="">Selecione uma instituição...</option>' +
                    instituicoes.map(i => `<option value="${i.id}">${i.nome} (CNPJ: ${i.cnpj})</option>`).join('');
            } catch (err) {
                document.getElementById('alunoInstituicao').innerHTML = '<option value="">Erro ao carregar instituições</option>';
            }
        }

        // Listar Alunos
        async function carregarAlunos() {
            try {
                const res = await fetch(API_ALUNOS);
                const alunos = await res.json();
                const container = document.getElementById('listaAlunos');
                
                if (alunos.length === 0) {
                    container.innerHTML = '<p style="color:#888;">Nenhum aluno cadastrado.</p>';
                    return;
                }

                container.innerHTML = alunos.map(a => `
                    <div class="item-card">
                        <div class="item-title">${a.nome} <span class="badge-saldo">${a.saldo} Moedas</span></div>
                        <div class="item-detail"><strong>Email:</strong> ${a.email} | <strong>CPF:</strong> ${a.cpf}</div>
                        <div class="item-detail"><strong>Curso:</strong> ${a.curso} | <strong>Instituição:</strong> ${a.instituicao ? a.instituicao.nome : 'N/A'}</div>
                        <div class="item-detail"><strong>Endereço:</strong> ${a.endereco ? `${a.endereco.logradouro},${a.endereco.numero} - ${a.endereco.cidade}/${a.endereco.estado}` : 'N/A'}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Erro ao listar alunos:', err);
            }
        }

        // Listar Empresas Parceiras
        async function carregarEmpresas() {
            try {
                const res = await fetch(API_EMPRESAS);
                const empresas = await res.json();
                const container = document.getElementById('listaEmpresas');

                if (empresas.length === 0) {
                    container.innerHTML = '<p style="color:#888;">Nenhuma empresa cadastrada.</p>';
                    return;
                }

                container.innerHTML = empresas.map(e => `
                    <div class="item-card empresa">
                        <div class="item-title">${e.nome}</div>
                        <div class="item-detail"><strong>Email:</strong> ${e.email} | <strong>CNPJ:</strong> ${e.cnpj}</div>
                        <div class="item-detail"><strong>Endereço:</strong> ${e.endereco ? `${e.endereco.logradouro},${e.endereco.numero} - ${e.endereco.cidade}/${e.endereco.estado}` : 'N/A'}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Erro ao listar empresas:', err);
            }
        }

        // Evento de Submissão: Aluno
        document.getElementById('formAluno').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                nome: document.getElementById('alunoNome').value,
                email: document.getElementById('alunoEmail').value,
                login: document.getElementById('alunoLogin').value,
                senha: document.getElementById('alunoSenha').value,
                cpf: document.getElementById('alunoCpf').value,
                rg: document.getElementById('alunoRg').value,
                curso: document.getElementById('alunoCurso').value,
                instituicaoId: Number(document.getElementById('alunoInstituicao').value),
                endereco: {
                    logradouro: document.getElementById('alunoLogradouro').value,
                    numero: document.getElementById('alunoNumero').value,
                    complemento: document.getElementById('alunoComplemento').value,
                    bairro: document.getElementById('alunoBairro').value,
                    cidade: document.getElementById('alunoCidade').value,
                    estado: document.getElementById('alunoEstado').value,
                    cep: document.getElementById('alunoCep').value
                }
            };

            try {
                const res = await fetch(API_ALUNOS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Aluno cadastrado com sucesso!');
                    document.getElementById('formAluno').reset();
                    carregarAlunos();
                } else {
                    const erro = await res.text();
                    alert('Erro ao cadastrar aluno: ' + erro);
                }
            } catch (err) {
                alert('Erro de conexão ao salvar aluno.');
            }
        });

        // Evento de Submissão: Empresa
        document.getElementById('formEmpresa').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                nome: document.getElementById('empresaNome').value,
                email: document.getElementById('empresaEmail').value,
                login: document.getElementById('empresaLogin').value,
                senha: document.getElementById('empresaSenha').value,
                cnpj: document.getElementById('empresaCnpj').value,
                endereco: {
                    logradouro: document.getElementById('empresaLogradouro').value,
                    numero: document.getElementById('empresaNumero').value,
                    complemento: document.getElementById('empresaComplemento').value,
                    bairro: document.getElementById('empresaBairro').value,
                    cidade: document.getElementById('empresaCidade').value,
                    estado: document.getElementById('empresaEstado').value,
                    cep: document.getElementById('empresaCep').value
                }
            };

            try {
                const res = await fetch(API_EMPRESAS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Empresa parceira cadastrada com sucesso!');
                    document.getElementById('formEmpresa').reset();
                    carregarEmpresas();
                } else {
                    const erro = await res.text();
                    alert('Erro ao cadastrar empresa: ' + erro);
                }
            } catch (err) {
                alert('Erro de conexão ao salvar empresa.');
            }
        });

        // Inicializar dados da tela
        carregarInstituicoes();
        carregarAlunos();
        carregarEmpresas();
    </script>
</body>
</html>
